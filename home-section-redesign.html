<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>De Williams Place Hotel — Home Section Redesign</title>
</head>
<body style="margin:0;background:#0e0b07;">

<!-- home section start -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@300;400;600&display=swap');

:root {
  --ink: #14100b;
  --brass: #D3AE00;
  --brass-light: #d3ac00c8;
  --ivory: #f4eee0;
  --amber-glow: #6b3f14;
}

/* ============ HERO ============ */
.home {
  position: relative;
  overflow: hidden;
  /* Layered fallback (warm charcoal + amber glow) sits under the real photo,
     so the section still reads as premium even before/without images loading */
  background:
    radial-gradient(1200px 600px at 15% -5%, rgba(198, 161, 91, 0.14), transparent 60%),
    radial-gradient(1100px 700px at 105% 105%, rgba(107, 63, 20, 0.4), transparent 60%),
    linear-gradient(160deg, #1c150d 0%, #0e0b07 60%, #14100b 100%),
    url("/images/landinggg.jpg") no-repeat center;
  background-size: cover;
  background-attachment: fixed;
  height: 100vh;
  min-height: 560px;
  color: var(--ivory);
  font-family: 'Manrope', 'lato', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

@media (max-width: 768px) {
  .home {
    background-attachment: scroll;
  }
}

/* Slow, deliberate drift on the active slide — a still photo should never feel static */
.bg-slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  z-index: 0;
  opacity: 0;
  transform: scale(1);
  transition: opacity 1.8s ease-in-out;
}

.bg-slide.active {
  opacity: 1;
  animation: driftZoom 9s ease-in-out infinite alternate;
}

@keyframes driftZoom {
  from { transform: scale(1); }
  to   { transform: scale(1.07); }
}

/* Warm vignette for legibility — amber-charcoal, not a flat black scrim */
.home::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg,
    rgba(20, 16, 11, 0.05) 0%,
    rgba(20, 16, 11, 0.12) 35%,
    rgba(20, 16, 11, 0.55) 78%,
    rgba(20, 16, 11, 0.92) 100%);
}

.home-content {
  width: 100%;
  height: 100%;
  position: relative;
  z-index: 2;
}

/* ============ CONTACT BAR — styled as a brass reception plate ============ */
.home-content .add {
  position: absolute;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 1140px;
  background: linear-gradient(180deg, rgba(30, 23, 14, 0.72) 0%, rgba(18, 14, 9, 0.88) 100%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--brass-light);
  border-bottom: 1px solid rgba(198, 161, 91, 0.35);
  box-shadow:
    0 1px 0 rgba(198, 161, 91, 0.15) inset,
    0 30px 60px rgba(0, 0, 0, 0.5),
    0 0 60px rgba(198, 161, 91, 0.06);
  border-radius: 3px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  text-align: center;
  padding: 30px 10px;
  animation: plateRise 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes plateRise {
  from { opacity: 0; transform: translate(-50%, 26px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}

@media (prefers-reduced-motion: reduce) {
  .home-content .add,
  .bg-slide.active {
    animation: none;
  }
}

.home-content .add > div {
  position: relative;
  padding: 0 24px;
}

/* hairline brass dividers between columns, like a directory plate */
.home-content .add > div + div::before {
  content: '';
  position: absolute;
  left: 0;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(198, 161, 91, 0.45), transparent);
}

.home-content .add b {
  display: block;
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--brass-light);
  margin-bottom: 10px;
}

.home-content .add p {
  margin: 0;
  font-family: 'Manrope', 'lato', sans-serif;
  font-weight: 300;
  font-size: 15.5px;
  line-height: 1.65;
  letter-spacing: 0.2px;
  color: var(--ivory);
}

/* Medium screens */
@media (max-width: 1200px) {
  .home-content .add { bottom: 36px; }
  .home-content .add p { font-size: 15px; }
}

/* Tablets */
@media (max-width: 992px) {
  .home-content .add {
    grid-template-columns: repeat(2, 1fr);
    row-gap: 22px;
    bottom: 28px;
    padding: 26px 18px;
  }
  .home-content .add > div:nth-child(3) {
    grid-column: 1 / -1;
    border-top: 1px solid rgba(198, 161, 91, 0.3);
    padding-top: 18px;
  }
  .home-content .add > div:nth-child(2)::before,
  .home-content .add > div:nth-child(3)::before {
    display: none;
  }
}

/* Mobile / small tablets */
@media (max-width: 768px) {
  .home-content .add {
    grid-template-columns: 1fr;
    bottom: 22px;
    padding: 24px 20px;
    row-gap: 18px;
  }
  .home-content .add > div::before { display: none; }
  .home-content .add > div + div {
    border-top: 1px solid rgba(198, 161, 91, 0.25);
    padding-top: 18px;
  }
  .home-content .add b { font-size: 13px; letter-spacing: 1.5px; }
  .home-content .add p { font-size: 14.5px; }
}

/* Small phones */
@media (max-width: 600px) {
  .home-content .add { padding: 20px 16px; }
}

/* Extra small devices */
@media (max-width: 400px) {
  .home-content .add { padding: 18px 14px; bottom: 16px; }
  .home-content .add b { font-size: 12px; letter-spacing: 1.2px; }
  .home-content .add p { font-size: 14px; }
}
</style>

<section class="home" id="home">
  <div class="bg-slide bg-slide-a"></div>
  <div class="bg-slide bg-slide-b"></div>

  <div class="home-content">
    <div class="add">
      <div>
        <p><b>Email us</b> dewilliamsplacehotel@gmail.com</p>
      </div>
      <div>
        <p><b>Whatsapp</b> +234 706 235 0574</p>
      </div>
      <div>
        <p><b>Visit us</b> Akala Express, Opposite Bovas Filling Station, Ibadan, Oyo State</p>
      </div>
    </div>
  </div>
</section>

<script>
  const images = [
    '/images/delounge.jpg',
    '/images/apart12.jpg',
    '/images/cinema.jpg',
    '/images/gym12.jpg',
    '/images/rooms12.jpg',
    '/images/lil.jpg',
    '/images/recep.jpg'
  ];

  const slideA = document.querySelector('.bg-slide-a');
  const slideB = document.querySelector('.bg-slide-b');

  let current = 0;
  let showingA = true;

  // Preload images so there's no flash/lag on first swap
  images.forEach(src => { const img = new Image(); img.src = src; });

  // Set the first image immediately
  slideA.style.backgroundImage = `url('${images[0]}')`;
  slideA.classList.add('active');

  setInterval(() => {
    current = (current + 1) % images.length;
    const nextSlide = showingA ? slideB : slideA;
    const currentSlide = showingA ? slideA : slideB;

    nextSlide.style.backgroundImage = `url('${images[current]}')`;
    nextSlide.classList.add('active');
    currentSlide.classList.remove('active');

    showingA = !showingA;
  }, 4000); // change image every 4 seconds
</script>
<!-- home section end -->

</body>
</html>
