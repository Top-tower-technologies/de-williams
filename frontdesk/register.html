<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register Service | Front Desk</title><link rel="stylesheet" href="../assets/css/shared/main.css"><link rel="stylesheet" href="../assets/css/frontdesk/frontdesk.css"></head><body data-role="frontdesk"><aside class="sidebar"><div class="brand side"><div class="logo">SR</div><div><b>Spa Register</b><small>Front Desk</small></div></div><nav><a href="dashboard.html" class="navlink">Dashboard</a><a href="register.html" class="navlink">Register Service</a><a href="transactions.html" class="navlink">Today's Entries</a></nav><button id="logout" class="logout">Logout</button></aside><main class="main"><header><div><h1>Register Service</h1><p id="today"></p></div><div class="user-pill" id="userPill">Front Desk</div></header><section class="panel"><h3>Register Customer Service</h3><p class="notice">Record the service exactly as issued. The final amount is calculated automatically.</p><form id="form" class="form-grid"><label>Date<input type="date" id="date" name="date" required></label><label>Service<select id="service" name="service_id" required></select></label><label>Staff<select id="staff" name="staff_id" required></select></label><label>Section<select id="section" name="section_id" required></select></label><label>Original Price (₦)<input type="number" id="price" name="original_price" min="0" step="0.01" required></label><label>Discount Type<select id="discount_type" name="discount_type"><option value="fixed">Fixed amount</option><option value="percent">Percentage</option></select></label><label>Discount<input type="number" id="discount_value" name="discount_value" min="0" step="0.01" value="0"></label><label>Final Amount<input id="final" readonly></label><label>Payment Method<select name="payment_method"><option>Cash</option><option>POS</option><option>Transfer</option></select></label><label class="span3">Notes<input name="notes" placeholder="Optional note"></label><div class="span3 actions"><button class="primary">Save Service</button><span id="msg" class="success"></span></div></form></section></main><script src="../assets/js/shared/config.js"></script><script src="../assets/js/shared/api.js"></script><script src="../assets/js/shared/utils.js"></script><script src="../assets/js/frontdesk/register.js"></script></body></html>
